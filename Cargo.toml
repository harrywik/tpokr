[package]
name = "tpokr"
version = "0.0.4"
edition = "2024"
default-run = "tpokr-client"
autobins = false

[[bin]]
name = "tpokr-client"
path = "src/main.rs"

[[bin]]
name = "tpokr-server"
path = "src/bin/server.rs"

[dependencies]
crossterm = "0.29"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.6", features = ["all"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "unstable-rendered-line-info"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }
