[package]
name = "tpokr"
version = "0.0.1"
edition = "2024"
default-run = "tpokr-client"
autobins = false

[[bin]]
name = "tpokr-client"
path = "src/main.rs"

[[bin]]
name = "tpokr-server"
path = "src/bin/server.rs"

[dependencies]
crossterm = "0.29"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "unstable-rendered-line-info"] }
